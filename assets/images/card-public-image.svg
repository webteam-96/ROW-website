<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Megaphone broadcasting club work">
  <!-- Drawn in the site's illustration language, measured from the Lottie art:
       single ink #1d1c1c, outline 3 / interior detail 2 on a 400 canvas
       (the planes run 2 on 800), multi-stop saturated gradients from the
       original palette, translucent white highlight, NO drop shadow, and
       hand-drawn curvature rather than geometric primitives. -->
  <defs>
    <linearGradient id="pi-cone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fd5352"/><stop offset=".55" stop-color="#fd74fd"/><stop offset="1" stop-color="#b349f9"/>
    </linearGradient>
    <linearGradient id="pi-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7af7f7"/><stop offset="1" stop-color="#83f582"/>
    </linearGradient>
    <linearGradient id="pi-grip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fd9140"/><stop offset="1" stop-color="#fd74fd"/>
    </linearGradient>
    <linearGradient id="pi-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff48d"/><stop offset="1" stop-color="#fd9140"/>
    </linearGradient>
  </defs>

  <style>
    .out  { stroke:#1d1c1c; stroke-width:3;   stroke-linejoin:round; stroke-linecap:round; }
    .det  { stroke:#1d1c1c; stroke-width:2;   stroke-linecap:round; fill:none; }
    .horn { animation: shout 3s ease-in-out infinite; transform-origin: 120px 205px; }
    .wave { animation: pulse 2.4s ease-out infinite; transform-origin: 252px 200px; }
    .wave:nth-of-type(2){ animation-delay:.35s } .wave:nth-of-type(3){ animation-delay:.7s }
    .spark { animation: twinkle 2.6s ease-in-out infinite; transform-origin: 168px 92px; }
    @keyframes shout { 0%,100%{transform:rotate(0)} 45%{transform:rotate(-5deg)} }
    @keyframes pulse { 0%{opacity:0;transform:scale(.55)} 30%{opacity:1} 100%{opacity:0;transform:scale(1.16)} }
    @keyframes twinkle { 0%,100%{transform:scale(.86) rotate(0)} 50%{transform:scale(1.1) rotate(12deg)} }
    @media (prefers-reduced-motion:reduce){ .horn,.wave,.spark{animation:none} .wave{opacity:1} }
  </style>

  <g class="horn">
    <!-- handle, drawn with a slight taper rather than a rectangle -->
    <path class="out" fill="url(#pi-grip)"
          d="M92 196 C80 198 70 204 68 212 C66 224 70 240 76 246 C82 251 92 250 100 246 Z"/>
    <path class="det" d="M84 214 C82 224 83 234 87 241"/>
    <!-- cone: edges bow outward the way the site's shapes do -->
    <path class="out" fill="url(#pi-cone)"
          d="M98 178 C138 168 186 146 224 122 C232 140 236 172 236 200 C236 232 231 266 223 284
             C186 258 138 238 98 230 C93 218 93 190 98 178 Z"/>
    <!-- interior creases, the plane's fine-line vocabulary -->
    <path class="det" d="M126 176 C130 196 130 214 126 232"/>
    <path class="det" d="M168 160 C174 188 174 220 168 248"/>
    <!-- highlight -->
    <path fill="#ffffff" opacity=".3"
          d="M112 182 C146 174 184 156 214 136 C216 146 217 156 217 164 C186 182 148 194 114 200 Z"/>
    <!-- mouth rim -->
    <path class="out" fill="url(#pi-rim)"
          d="M224 122 C238 128 248 158 248 202 C248 246 238 278 223 284 C231 264 236 232 236 200 C236 170 232 140 224 122 Z"/>
  </g>

  <!-- broadcast arcs, same weight as the outline so they read as one drawing -->
  <g class="det" stroke-width="3">
    <path class="wave" d="M268 166 C282 180 282 222 268 238"/>
    <path class="wave" d="M296 142 C318 168 318 234 296 262"/>
    <path class="wave" d="M324 118 C354 156 354 246 324 286"/>
  </g>

  <!-- spark -->
  <g class="spark">
    <path class="out" fill="url(#pi-star)"
          d="M168 58 C173 76 179 86 197 92 C179 98 173 108 168 126 C163 108 157 98 139 92 C157 86 163 76 168 58 Z"/>
  </g>
</svg>
