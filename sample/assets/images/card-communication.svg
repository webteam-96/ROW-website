<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Club members messaging each other">
  <!-- Site illustration language: ink #1d1c1c, outline 3 / detail 2 on a 400
       canvas, palette gradients from the original art, no drop shadow. -->
  <defs>
    <linearGradient id="cm-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7af7f7"/><stop offset="1" stop-color="#83f582"/>
    </linearGradient>
    <linearGradient id="cm-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fd9140"/><stop offset=".55" stop-color="#fd74fd"/><stop offset="1" stop-color="#b349f9"/>
    </linearGradient>
  </defs>

  <style>
    .out { stroke:#1d1c1c; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
    .det { stroke:#1d1c1c; stroke-width:2; stroke-linecap:round; fill:none; }
    .b1  { animation: rise 3.4s ease-in-out infinite; transform-origin:150px 160px; }
    .b2  { animation: rise 3.4s ease-in-out infinite 1.7s; transform-origin:258px 268px; }
    .dot { animation: blink 1.5s ease-in-out infinite; }
    .dot:nth-of-type(2){animation-delay:.22s} .dot:nth-of-type(3){animation-delay:.44s}
    @keyframes rise { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes blink { 0%,100%{opacity:.35;transform:translateY(0)} 50%{opacity:1;transform:translateY(-4px)} }
    @media (prefers-reduced-motion:reduce){ .b1,.b2,.dot{animation:none} .dot{opacity:1} }
  </style>

  <!-- back bubble: orange -> magenta -> purple, tail bottom-right -->
  <g class="b2">
    <path class="out" fill="url(#cm-b)"
          d="M206 208 C206 190 220 178 240 177 C276 175 314 175 340 178 C358 180 368 192 368 208
             C368 232 367 254 364 270 C362 286 350 296 332 297 C316 298 300 298 286 298
             C282 316 272 330 256 340 C262 324 262 310 258 297 C244 296 234 294 226 290
             C213 284 207 274 206 260 Z"/>
    <path fill="#ffffff" opacity=".28"
          d="M222 200 C230 190 246 186 266 185 C296 184 324 185 344 188 C330 196 300 200 268 201 C246 202 230 201 222 200 Z"/>
    <g class="det">
      <path d="M232 226 C266 223 306 223 340 226"/>
      <path d="M232 252 C258 249 288 249 312 252"/>
    </g>
  </g>

  <!-- front bubble: cyan -> green, tail bottom-left, typing dots -->
  <g class="b1">
    <path class="out" fill="url(#cm-a)"
          d="M40 148 C40 128 54 115 76 114 C116 112 158 112 188 115 C208 117 218 130 218 148
             C218 174 217 198 214 216 C212 233 199 244 179 245 C160 246 142 246 128 246
             C118 266 102 280 82 288 C92 270 94 256 90 245 C74 244 62 241 54 236 C44 229 40 218 40 202 Z"/>
    <path fill="#ffffff" opacity=".32"
          d="M58 138 C68 127 86 122 108 121 C142 120 172 121 194 124 C178 133 146 138 110 139 C86 140 68 139 58 138 Z"/>
    <g class="dot-row">
      <circle class="dot" cx="96"  cy="180" r="13" fill="#1d1c1c"/>
      <circle class="dot" cx="130" cy="180" r="13" fill="#1d1c1c"/>
      <circle class="dot" cx="164" cy="180" r="13" fill="#1d1c1c"/>
    </g>
    <path class="det" d="M70 214 C104 211 148 211 184 214"/>
  </g>
</svg>
